<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#primaryGrad)" />
  
  <!-- Bus Silhouette -->
  <g fill="#FFFFFF" transform="translate(24, 26)">
    <!-- Main Body -->
    <rect x="6" y="8" width="60" height="46" rx="8" />
    <!-- Windshield -->
    <rect x="12" y="14" width="48" height="16" rx="3" fill="#1D4ED8" opacity="0.25" />
    <!-- Destination Sign -->
    <rect x="24" y="10" width="24" height="3" rx="1.5" fill="#3B82F6" />
    <!-- Headlights -->
    <circle cx="16" cy="42" r="3.5" fill="#FEF08A" />
    <circle cx="56" cy="42" r="3.5" fill="#FEF08A" />
    <!-- Bumper Grill -->
    <rect x="25" y="41" width="22" height="2.5" rx="1" fill="#93C5FD" />
    <rect x="27" y="45" width="18" height="2" rx="1" fill="#93C5FD" />
    <!-- Wheels -->
    <rect x="14" y="52" width="10" height="6" rx="2" fill="#1E293B" />
    <rect x="48" y="52" width="10" height="6" rx="2" fill="#1E293B" />
  </g>
  
  <!-- Live Signal Ping Marker -->
  <circle cx="92" cy="28" r="8" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="92" cy="28" r="4" fill="#FFFFFF" />
</svg>
